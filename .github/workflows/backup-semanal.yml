# Backup semanal do Mr. Control por e-mail.
# Toda segunda-feira ~07:17 (Brasília) e quando você clicar em "Run workflow".
# O repositório é público: o robô só imprime contagens e NÃO guarda o backup
# no GitHub (nada de artifacts) — o arquivo vai apenas por e-mail aos administradores.
name: Backup semanal por e-mail

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-semanal
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r backup/requirements.txt
      - name: Gerar e enviar o backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
        run: python backup/enviar_backup.py
